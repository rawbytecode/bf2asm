name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install toolchain (binutils for as/ld)
        run: sudo apt-get update && sudo apt-get install -y binutils

      - name: Run test suite
        run: python3 -m unittest discover -v

      - name: Build examples via Makefile
        run: make all

      - name: Smoke test hello.bf binary
        run: |
          out="$(./build/hello)"
          test "$out" = "Hello World!"
